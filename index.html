<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join my library</title>
<style>
  :root { --bg:#faf8f5; --fg:#1f1b16; --muted:#6b645b; --card:#fff; --accent:#8a4b14; --on-accent:#fff; --border:#e5dfd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17130f; --fg:#f2ece4; --muted:#a79e92; --card:#221d17; --accent:#e0a063; --on-accent:#1f1b16; --border:#352e26; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { box-sizing:border-box; width:100%; max-width:26rem; margin:16px; padding:24px; background:var(--card);
         border:1px solid var(--border); border-radius:16px; text-align:center; }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  p { margin:8px 0; color:var(--muted); }
  .code { display:inline-block; margin:12px 0; padding:8px 16px; border:1px dashed var(--border); border-radius:10px;
          font:700 1.6rem/1.2 ui-monospace, Consolas, monospace; letter-spacing:.12em; color:var(--fg); }
  a.button { display:block; margin:16px 0 4px; padding:14px; border-radius:12px; background:var(--accent); color:var(--on-accent);
             font-weight:600; text-decoration:none; }
  [hidden] { display:none; }
</style>
</head>
<body>
<main>
  <h1>Join my library share</h1>
  <div id="with-code" hidden>
    <p>Your invite code</p>
    <div class="code" id="code"></div>
    <a class="button" id="open" href="#">Open in the app</a>
    <p>Nothing happened? Install My Library, open the <b>Friends and family</b> tab and type the code above in <b>Invite code</b>.</p>
  </div>
  <div id="no-code" hidden>
    <p>This invitation link has no valid invite code. Ask for a new one.</p>
  </div>
</main>
<script>
  var raw = new URLSearchParams(location.search).get("code") || "";
  var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  if (code) {
    var link = "mylibrary://join?code=" + code;
    document.getElementById("code").textContent = code;
    document.getElementById("open").href = link;
    document.getElementById("with-code").hidden = false;
    // Try the app straight away; if it is not installed the page simply stays.
    setTimeout(function () { location.href = link; }, 300);
  } else {
    document.getElementById("no-code").hidden = false;
  }
</script>
</body>
</html>
